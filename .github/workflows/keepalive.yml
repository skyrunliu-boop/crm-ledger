name: Keep Supabase Alive
on:
  schedule:
    - cron: '23 3 */3 * *'      # 每 3 天 UTC 03:23 自动访问一次，防止免费库被暂停 / 删除
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/crm_items?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
        env:
          SUPABASE_URL: https://depgkucsgxsjgsdesuzc.supabase.co
          SUPABASE_KEY: sb_publishable_3PJvPHoGmdtW6sjWc7MObw_ccm2ibky
